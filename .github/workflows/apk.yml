name: APK

# Compila la APK en cada cambio de main y la publica en Releases.
# El enlace .../releases/latest/download/ZenRadio.apk siempre da la última.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Compilar la APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Preparar el archivo
        run: cp app/build/outputs/apk/release/app-release.apk ZenRadio.apk

      - name: Guardar la APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: ZenRadio-apk
          path: ZenRadio.apk
          retention-days: 30

      - name: Publicar la APK en Releases
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="0.1.${GITHUB_RUN_NUMBER}"
          gh release create "v${VERSION}" ZenRadio.apk \
            --title "ZenRadio ${VERSION}" \
            --notes "$(git log -1 --pretty=%s)" \
            --target "${GITHUB_SHA}" \
            --latest
